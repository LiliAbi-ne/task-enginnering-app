<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Engineering App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-header">
        <div class="header-container">
            <div class="logo">
                <span>Task</span>Engineering
            </div>
            <nav class="nav-links">
                <a href="index.html" class="active">Dashboard</a>
                <a href="about.html">Acerca de</a>
            </nav>
        </div>
    </header>

    <main class="app-container">
        
        <section class="dashboard-header">
            <h1>Panel de Control</h1>
            <p>Gestiona tus proyectos y flujos de trabajo de ingeniería.</p>
        </section>

        <div class="workspace-grid">
            
            <section class="task-form-section">
                <h2>Nueva Tarea</h2>
                <form id="task-form">
                    <div class="form-group">
                        <label for="task-title">Nombre de la tarea</label>
                        <input type="text" id="task-title" placeholder="Ej. Diseñar base de datos" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="task-priority">Prioridad</label>
                        <select id="task-priority">
                            <option value="low">Baja</option>
                            <option value="medium" selected>Media</option>
                            <option value="high">Alta</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-primary">Añadir Tarea</button>
                </form>
            </section>

            <section class="task-list-section">
                <h2>Mis Tareas</h2>
                <div id="tasks-container" class="tasks-container">
                    <p class="empty-state">No hay tareas pendientes. ¡Buen trabajo!</p>
                </div>
            </section>

        </div>
    </main>

    <footer class="app-footer">
        <p>&copy; 2026 Task Engineering App. Todos los derechos reservados.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
